spring.application.name=stadifix-api

#PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5433/stadifix_db
spring.datasource.username=stadifix
spring.datasource.password=${STADIFIX_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
stadifix.jwt.secret=${STADIFIX_JWT_SECRET}
stadifix.jwt.issuer=stadifix-api
stadifix.jwt.access-token-minutes=15


server.port=8080
